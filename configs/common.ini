#
# Shared MTT defaults, Open MPI get/build, launcher, local reporter.
# Placeholders (@VAR@) are expanded by lib/mtt.sh.
#
# Reports stay local. There is no IUDatabase / upstream submit section.
#

[MTTDefaults]
trial = @TRIAL@
description = Open MPI regression test — @BRANCH@ on @HOSTNAME@
platform = @PLATFORM@
executor = sequential
scratchdir = @SCRATCH@

[Profile:Installed]

#----------------------------------------------------------------------
# Middleware: obtain and build Open MPI
#----------------------------------------------------------------------

[ASIS MiddlewareGet:OMPI]
plugin = Git
url = https://github.com/open-mpi/ompi
branch = @BRANCH@
recursive = 1

[ASIS MiddlewareBuild:OMPI]
parent = MiddlewareGet:OMPI
plugin = Autotools
autogen_cmd = ./autogen.pl
# --disable-maintainer-mode: make clean must not regenerate Makefile.in
# (OpenPMIx src/class wants ../VERSION and fails).
configure_options = --disable-debug --enable-mpi1-compatibility --disable-mpi-ext --disable-ft --disable-oshmem --disable-dependency-tracking --disable-maintainer-mode --with-pmix=internal --with-prrte=internal --with-hwloc=internal --with-libevent=internal
# Autotools already does: make $opts clean; make $opts all; make $opts install.
# Putting "install" here becomes "make -j N install all" and races libtool wrappers.
# Serial make: -j still collapses PRRTE convenience libs to /.libs/*.a
make_options = -j 1

#----------------------------------------------------------------------
# Launcher defaults
#----------------------------------------------------------------------

[LauncherDefaults:OMPI]
plugin = OpenMPI
command = mpirun --allow-run-as-root --oversubscribe
np = @NP@
hostfile = @HOSTFILE@
merge_stdout_stderr = 1
stdout_save_lines = 100
stderr_save_lines = 100

#----------------------------------------------------------------------
# Local reporter only
#----------------------------------------------------------------------

[Reporter:TextFile]
plugin = TextFile
filename = @RESULTS_DIR@/summary.txt
textwrap = 78

# Only included when --submit is passed. Same shape as
# https://github.com/open-mpi/mtt/issues/956
[Reporter:IUDatabase]
plugin = IUDatabase
realm = OMPI
url = https://mtt.open-mpi.org/submit/cpy/api/
username = @MTT_USER@
password = @MTT_PASS@
platform = @PLATFORM@
hostname = @HOSTNAME@
