#
# IBM MPI tests from a local tree (old Perl MTT Copytree + Simple).
# Single-node: no hostfile, mpirun --oversubscribe, np from --np
# (defaults to nproc for this suite).
#
# Source: --ibm-src DIR, or $IBM_TEST_SRC, or $ibm_test_src
#

[ASIS TestGet:IBM]
parent = MiddlewareBuild:OMPI
plugin = Copytree
src = @IBM_TEST_SRC@

[ASIS TestBuild:IBM]
parent = TestGet:IBM
middleware = MiddlewareBuild:OMPI
autogen_cmd = ./autogen.sh
configure_options = CC=mpicc CXX=mpicxx F77=mpif77 FC=mpifort --enable-static --disable-shared
make_options = -j @JOBS@
merge_stdout_stderr = 1
stderr_save_lines = 100

# Bulk walk. Perl simple_first: --timeout 50.
# Tests with a different timeout or expected-fail are re-run below.
[TestRun:IBM]
parent = TestBuild:IBM
plugin = OpenMPI
timeout = 50
test_dir = "collective, communicator, datatype, environment, group, info, io, onesided, pt2pt, random, topology"
skip_tests = int_overflow, abort, final, ssend, sendrecv_big, leakcatch, 1sided, pp_1sided, mt_1sided, comm_split_f

# Perl simple_medium
[TestRun:IBM-medium]
parent = TestBuild:IBM
plugin = OpenMPI
timeout = 200
test_dir = pt2pt
test_list = ssend, sendrecv_big

# Perl simple_slow (comm_split_f is long on x86)
[TestRun:IBM-slow]
parent = TestBuild:IBM
plugin = OpenMPI
timeout = 600
test_dir = communicator
test_list = comm_split_f

# Perl simple_very_slow
[TestRun:IBM-very-slow]
parent = TestBuild:IBM
plugin = OpenMPI
timeout = 600
test_dir = "random, onesided"
test_list = leakcatch, 1sided, pp_1sided

# Perl simple_too_slow
[TestRun:IBM-too-slow]
parent = TestBuild:IBM
plugin = OpenMPI
timeout = 3000
test_dir = onesided
test_list = mt_1sided

# Perl simple_fail: abort/final must exit non-zero
[TestRun:IBM-fail]
parent = TestBuild:IBM
plugin = OpenMPI
timeout = 200
test_dir = environment
test_list = abort, final
fail_tests = abort, final
