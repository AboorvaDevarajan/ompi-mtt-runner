#
# MPICH test suite, built and run against Open MPI.
#

[ASIS TestGet:MPICH]
parent = MiddlewareBuild:OMPI
plugin = Git
url = https://github.com/pmodels/mpich

[TestBuild:MPICH]
parent = TestGet:MPICH
middleware = MiddlewareBuild:OMPI
plugin = Shell
command = sh @TESTS_DIR@/mpich-build.sh @JOBS@

# Default sweep at --np (usually 2). Tests that need a different
# np or extra args are run in the sections below, not skipped.
[TestRun:MPICH]
parent = TestBuild:MPICH
plugin = OpenMPI
timeout = 600
test_dir = "test/mpi/pt2pt, test/mpi/collective, test/mpi/comm, test/mpi/datatype, test/mpi/init"
skip_tests = cmsplit, commcreate1, ic2, iccreate, icsplit, large_message, large_vec, pingping, sendrecv1, sendself
fail_tests = exitst1, exitst2, exitst3

[TestRun:MPICH-np3]
parent = TestBuild:MPICH
plugin = OpenMPI
np = 3
timeout = 600
test_dir = "test/mpi/pt2pt, test/mpi/datatype"
test_list = large_message, large_vec

[TestRun:MPICH-np4]
parent = TestBuild:MPICH
plugin = OpenMPI
np = 4
timeout = 600
test_dir = test/mpi/comm
test_list = cmsplit, commcreate1, iccreate, icsplit

[TestRun:MPICH-np33]
parent = TestBuild:MPICH
plugin = OpenMPI
np = 33
timeout = 600
test_dir = test/mpi/comm
test_list = ic2

[TestRun:MPICH-seed]
parent = TestBuild:MPICH
plugin = OpenMPI
command = @TESTS_DIR@/mpich-mpirun-seed.sh
np = 2
timeout = 600
test_dir = test/mpi/pt2pt
test_list = pingping, sendrecv1, sendself
