#
# MPICH test suite, built and run against Open MPI.
# Walk each directory at a default np, then re-run tests that the
# MPICH testlist says need a different np or extra args.
#

[ASIS TestGet:MPICH]
parent = MiddlewareBuild:OMPI
plugin = Git
url = https://github.com/pmodels/mpich

[TestBuild:MPICH]
parent = TestGet:MPICH
middleware = MiddlewareBuild:OMPI
plugin = Shell
command = sh @TESTS_DIR@/mpich-build.sh @JOBS@

# Default sweep at --np (usually 2).
[TestRun:MPICH]
parent = TestBuild:MPICH
plugin = OpenMPI
timeout = 600
test_dir = "test/mpi/pt2pt, test/mpi/comm, test/mpi/datatype, test/mpi/init, test/mpi/attr, test/mpi/info, test/mpi/errhan, test/mpi/mpi_t, test/mpi/rma, test/mpi/part"
skip_tests = cmsplit, commcreate1, ic2, iccreate, icsplit, large_message, large_vec, pingping, sendrecv1, sendself, pipeline, attric, attrend2, fkeyvaltype, qmpi_test, mpit_isendirecv, start_pready, start_pready_wait, start_pready_range, start_pready_list, start_pready_list_non_consecutive, parrived, parrived_wait, parrived_pready_out_of_order, parrived_strided, nb_test, putfidx, adlb_mimic1, accfence2, getgroup, lockcontention, lockcontention2, lockcontention3, fetchandadd, fetchandadd_tree, fetchandadd_am, fetchandadd_tree_am, accfence2_am, nullpscw, nullpscw_shm, mixedsync, strided_putget_indexed, strided_putget_indexed_shared, strided_getacc_indexed, strided_getacc_indexed_shared, window_allocation, window_noncontig_allocation, window_attach, window_attach_collattach, contention_put, contention_putget, win_flavors, win_shared, win_shared_create_allocshm, win_shared_create_no_allocshm, win_shared_noncontig, win_shared_noncontig_put, win_shared_query, win_zero, win_large_shm, win_dynamic_acc, win_dynamic_acc_collattach, linked_list, linked_list_fop, compare_and_swap, fetch_and_op_char, fetch_and_op_short, fetch_and_op_int, fetch_and_op_long, fetch_and_op_double, fetch_and_op_long_double, fetch_and_op_char_hwacc, fetch_and_op_short_hwacc, fetch_and_op_int_hwacc, fetch_and_op_long_hwacc, fetch_and_op_double_hwacc, fetch_and_op_long_double_hwacc, fetch_and_op_char_accop_hwacc, fetch_and_op_short_accop_hwacc, fetch_and_op_int_accop_hwacc, fetch_and_op_long_accop_hwacc, fetch_and_op_double_accop_hwacc, fetch_and_op_long_double_accop_hwacc, get_accumulate_double, get_accumulate_double_derived, get_accumulate_int, get_accumulate_int_derived, get_accumulate_long, get_accumulate_long_derived, get_accumulate_short, get_accumulate_short_derived, flush, reqops, req_example, req_example_shm, linked_list_lockall, pscw_ordering, pscw_ordering_shm, linked_list_bench_lock_all, linked_list_bench_lock_excl, linked_list_bench_lock_shr, linked_list_bench_lock_shr_nocheck, mutex_bench, mutex_bench_shared, mutex_bench_shm, mutex_bench_shm_ordered, acc_loc, win_shared_zerobyte, win_shared_put_flush_get, atomic_rmw_fop, atomic_rmw_cas, atomic_rmw_gacc, atomic_get_short_int, atomic_get_2int, atomic_get_long_int, atomic_get_float_int, atomic_get_double_int, atomic_get_long_double_int, derived_acc_flush_local, large_acc_flush_local, win_shared_put_flush_load, win_shared_acc_flush_load, win_shared_gacc_flush_load, win_shared_fop_flush_load, win_shared_cas_flush_load, put_flush_get, acc_flush_get, gacc_flush_get, fop_flush_get, cas_flush_get, overlap_wins_put, overlap_wins_acc, overlap_wins_gacc, overlap_wins_fop, overlap_wins_cas, lock_nested, get_flushlocal, get_flushlocal_shm, win_shared_query_null, win_dynamic_rma_flush_get, win_dynamic_rma_flush_get_collattach, lockall_dt, putpscw1, lock_contention_dt, lockall_dt_flushall, getfence1, lock_dt, lock_dt_flush, lock_dt_flushlocal, accfence1, lockall_dt_flush, putfence1, lockall_dt_flushlocal, accpscw1, epochtest, lockall_dt_flushlocalall
fail_tests = exitst1, exitst2, exitst3, errfatal

[TestRun:MPICH-np3]
parent = TestBuild:MPICH
plugin = OpenMPI
np = 3
timeout = 600
test_dir = "test/mpi/pt2pt, test/mpi/datatype, test/mpi/rma"
test_list = large_message, large_vec, adlb_mimic1, lockcontention, atomic_rmw_fop, atomic_rmw_cas, atomic_rmw_gacc, atomic_get_short_int, atomic_get_2int, atomic_get_long_int, atomic_get_float_int, atomic_get_double_int, atomic_get_long_double_int, derived_acc_flush_local, large_acc_flush_local, win_shared_put_flush_load, win_shared_acc_flush_load, win_shared_gacc_flush_load, win_shared_fop_flush_load, win_shared_cas_flush_load, put_flush_get, acc_flush_get, gacc_flush_get, fop_flush_get, cas_flush_get, overlap_wins_put, overlap_wins_acc, overlap_wins_gacc, overlap_wins_fop, overlap_wins_cas, lock_nested

